name: Owner-only publishing

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# This workflow needs no repository or pull-request token permissions.
permissions: {}

jobs:
  owner_only:
    name: Owner-only publishing gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the sole publishing owner
        env:
          # The numeric GitHub user ID survives an account-login rename.
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PUBLISHING_OWNER_ID: "239253033"
        run: |
          if [ "$PR_AUTHOR_ID" != "$PUBLISHING_OWNER_ID" ]; then
            echo "Only the publishing owner account may author a pull request."
            exit 1
          fi
          echo "Confirmed owner-authored pull request."
